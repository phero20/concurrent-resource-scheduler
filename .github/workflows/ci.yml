name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.22.x', '1.25.x']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Verify Formatting
      run: if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted"; exit 1; fi

    - name: Test
      run: go test -v ./...

    - name: Test with Race Detector
      run: go test -race -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test Prometheus Extension
      if: startsWith(matrix.go-version, '1.25')
      run: |
        go work init
        go work use .
        go work use ./extensions/prometheus
        cd extensions/prometheus
        go test -v ./...
        go test -race -v ./...
        go vet ./...
