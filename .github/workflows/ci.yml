name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Build
      run: go build -v ./...

    - name: Verify Formatting
      run: if [ -n "$(gofmt -l .)" ]; then echo "Go code is not formatted"; exit 1; fi

    - name: Test
      run: go test -v ./...

    - name: Test with Race Detector
      run: go test -race -v ./...

    - name: Vet
      run: go vet ./...
