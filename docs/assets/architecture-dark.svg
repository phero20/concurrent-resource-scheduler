<svg width="820" height="420" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Concurrent Resource Scheduler architecture</title>
  <desc>Application code calls the scheduler core, which delegates shard selection to an acquire strategy and looks up resources via an O(1) lookup map, operating on independently-locked heap shards.</desc>

  <defs>
    <marker id="arrowd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="820" height="420" fill="#0d1117"/>

  <!-- Application layer -->
  <rect x="40" y="30" width="200" height="52" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="140" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Application code</text>

  <line x1="140" y1="82" x2="140" y2="112" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowd)"/>
  <text x="150" y="102" font-size="11" fill="#8b949e">Add · Acquire · Release</text>

  <!-- Scheduler core -->
  <rect x="20" y="114" width="780" height="270" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="140" font-size="13" font-weight="600" fill="#c9d1d9">Scheduler core</text>

  <!-- Acquire strategy box -->
  <rect x="50" y="158" width="190" height="64" rx="8" fill="#122148" stroke="#3b5aa8" stroke-width="1"/>
  <text x="145" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#8ab4f8">Acquire strategy</text>
  <text x="145" y="202" text-anchor="middle" font-size="11" fill="#a9c6f5">Round robin · weighted · adaptive</text>

  <!-- Lookup map box -->
  <rect x="50" y="242" width="190" height="64" rx="8" fill="#3a2410" stroke="#8a5a22" stroke-width="1"/>
  <text x="145" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#f0b862"/>
  <text x="145" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#f0b862">Lookup map</text>
  <text x="145" y="286" text-anchor="middle" font-size="11" fill="#e3c48f">RWMutex-protected, O(1) by ID</text>

  <!-- Arrow from strategy to shards -->
  <line x1="240" y1="190" x2="290" y2="190" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowd)"/>
  <text x="220" y="140" font-size="11" fill="#8b949e">selects shard</text>

  <!-- Shards -->
  <g>
    <rect x="290" y="150" width="150" height="60" rx="8" fill="#0f2e1c" stroke="#2e7d4f" stroke-width="1"/>
    <text x="365" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#6fd39a">Heap shard 1</text>
    <text x="365" y="194" text-anchor="middle" font-size="11" fill="#8fcdad">own mutex</text>

    <rect x="460" y="150" width="150" height="60" rx="8" fill="#0f2e1c" stroke="#2e7d4f" stroke-width="1"/>
    <text x="535" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#6fd39a">Heap shard 2</text>
    <text x="535" y="194" text-anchor="middle" font-size="11" fill="#8fcdad">own mutex</text>

    <rect x="630" y="150" width="150" height="60" rx="8" fill="#0f2e1c" stroke="#2e7d4f" stroke-width="1"/>
    <text x="705" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#6fd39a">Heap shard N</text>
    <text x="705" y="194" text-anchor="middle" font-size="11" fill="#8fcdad">own mutex</text>
  </g>

  <text x="290" y="232" font-size="11" fill="#8b949e">Each shard is an independent min/max priority heap — locking one never blocks another.</text>

  <!-- Extensions row -->
  <rect x="290" y="252" width="150" height="54" rx="8" fill="#2c1a35" stroke="#6f4487" stroke-width="1"/>
  <text x="365" y="275" text-anchor="middle" font-size="12" font-weight="600" fill="#d6a9e8">Cooldown</text>
  <text x="365" y="292" text-anchor="middle" font-size="10.5" fill="#c396d6">async observer</text>

  <rect x="460" y="252" width="150" height="54" rx="8" fill="#2c1a35" stroke="#6f4487" stroke-width="1"/>
  <text x="535" y="275" text-anchor="middle" font-size="12" font-weight="600" fill="#d6a9e8">Telemetry</text>
  <text x="535" y="292" text-anchor="middle" font-size="10.5" fill="#c396d6">atomic counters</text>

  <rect x="630" y="252" width="150" height="54" rx="8" fill="#2c1a35" stroke="#6f4487" stroke-width="1"/>
  <text x="705" y="275" text-anchor="middle" font-size="12" font-weight="600" fill="#d6a9e8">Prometheus</text>
  <text x="705" y="292" text-anchor="middle" font-size="10.5" fill="#c396d6">optional exporter</text>

  <line x1="365" y1="216" x2="365" y2="252" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="535" y1="216" x2="535" y2="252" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="705" y1="216" x2="705" y2="252" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="640" y="222" font-size="10.5" fill="#8b949e">async events</text>

  <text x="40" y="330" font-size="11" fill="#8b949e">No global mutex exists anywhere in this diagram — every lock shown above is scoped to its own box.</text>

  <text x="40" y="405" font-size="11" fill="#6e7681">concurrent-resource-scheduler · docs/assets/architecture-dark.svg</text>
</svg>
