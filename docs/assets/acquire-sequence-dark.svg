<svg width="820" height="330" viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Acquire (exclusive) sequence</title>
  <desc>Sequence diagram showing a caller acquiring a resource under the exclusive policy: the scheduler asks the acquire strategy for a candidate shard, locks only that shard, pops the resource, unlocks, and emits an event asynchronously before returning to the caller.</desc>

  <defs>
    <marker id="arrow2d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#c9d1d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="820" height="330" fill="#0d1117"/>

  <!-- Lifelines -->
  <g font-size="12.5" font-weight="600" fill="#e6edf3">
    <text x="70"  y="26" text-anchor="middle">Caller</text>
    <text x="240" y="26" text-anchor="middle">Scheduler</text>
    <text x="420" y="26" text-anchor="middle">Acquire strategy</text>
    <text x="600" y="26" text-anchor="middle">Heap shard</text>
    <text x="750" y="26" text-anchor="middle">Dispatcher</text>
  </g>
  <g stroke="#30363d" stroke-width="1">
    <line x1="70"  y1="36" x2="70"  y2="300"/>
    <line x1="240" y1="36" x2="240" y2="300"/>
    <line x1="420" y1="36" x2="420" y2="300"/>
    <line x1="600" y1="36" x2="600" y2="300"/>
    <line x1="750" y1="36" x2="750" y2="300"/>
  </g>

  <!-- messages -->
  <g font-size="11.5" fill="#c9d1d9">
    <line x1="70" y1="60" x2="234" y2="60" stroke="#c9d1d9" stroke-width="1.3" marker-end="url(#arrow2d)"/>
    <text x="80" y="53">Acquire()</text>

    <line x1="240" y1="90" x2="414" y2="90" stroke="#c9d1d9" stroke-width="1.3" marker-end="url(#arrow2d)"/>
    <text x="250" y="83">Select(shardView)</text>

    <line x1="420" y1="118" x2="246" y2="118" stroke="#c9d1d9" stroke-width="1.3" marker-end="url(#arrow2d)"/>
    <text x="270" y="111">candidate shard ID</text>

    <line x1="240" y1="146" x2="594" y2="146" stroke="#c9d1d9" stroke-width="1.3" marker-end="url(#arrow2d)"/>
    <text x="330" y="139">lock shard, pop()</text>

    <line x1="600" y1="174" x2="246" y2="174" stroke="#c9d1d9" stroke-width="1.3" marker-end="url(#arrow2d)"/>
    <text x="330" y="167">resource, unlock</text>

    <line x1="240" y1="202" x2="744" y2="202" stroke="#d6a9e8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow2d)"/>
    <text x="330" y="195" fill="#d6a9e8">emit(EventAcquire) — non-blocking</text>

    <line x1="240" y1="234" x2="76" y2="234" stroke="#6fd39a" stroke-width="1.5" marker-end="url(#arrow2d)"/>
    <text x="90" y="227" fill="#6fd39a" font-weight="600">resource, nil error</text>
  </g>

  <text x="70" y="270" font-size="11" fill="#8b949e">Only the selected shard is ever locked. The event to the dispatcher is fired</text>
  <text x="70" y="286" font-size="11" fill="#8b949e">after the scheduler's own lock is released, so a slow observer cannot block Acquire().</text>

  <text x="40" y="318" font-size="11" fill="#6e7681">concurrent-resource-scheduler · docs/assets/acquire-sequence-dark.svg</text>
</svg>
