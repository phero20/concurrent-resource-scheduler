<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <title>Affinity routing via consistent hashing</title>
  <desc>A session key is hashed with FNV-1a and located on a consistent hash ring via binary search, which deterministically maps it to the same heap shard on every call.</desc>

  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5f6b7a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="220" fill="#ffffff"/>

  <rect x="20" y="80" width="140" height="56" rx="8" fill="#eef1f5" stroke="#c7ced8" stroke-width="1"/>
  <text x="90" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Session key</text>
  <text x="90" y="122" text-anchor="middle" font-size="10.5" fill="#6b7280">"user_1"</text>

  <line x1="160" y1="108" x2="200" y2="108" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="163" y="98" font-size="10" fill="#6b7280">FNV-1a</text>

  <rect x="202" y="80" width="140" height="56" rx="8" fill="#e7ecfb" stroke="#a9b8ea" stroke-width="1"/>
  <text x="272" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#28418c">64-bit digest</text>
  <text x="272" y="122" text-anchor="middle" font-size="10.5" fill="#4a5b8f">deterministic</text>

  <line x1="342" y1="108" x2="410" y2="108" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="345" y="98" font-size="10" fill="#6b7280">binary search</text>

  <rect x="412" y="80" width="180" height="56" rx="8" fill="#fbeee0" stroke="#e6bd8f" stroke-width="1"/>
  <text x="502" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8a4b12">Hash ring</text>
  <text x="502" y="122" text-anchor="middle" font-size="10.5" fill="#96633a">500 virtual nodes / shard</text>

  <line x1="592" y1="108" x2="650" y2="108" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="595" y="98" font-size="10" fill="#6b7280">resolves to</text>

  <rect x="652" y="80" width="160" height="56" rx="8" fill="#e5f3ec" stroke="#9bd1b3" stroke-width="1"/>
  <text x="732" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c6b41">Heap shard 3</text>
  <text x="732" y="122" text-anchor="middle" font-size="10" fill="#3f8763">same key, same shard</text>

  <text x="20" y="180" font-size="11" fill="#6b7280">Used exclusively by AcquireByAffinity for deterministic sticky-session routing.</text>
</svg>
